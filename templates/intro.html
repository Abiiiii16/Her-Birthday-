<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    height: 100vh;
    width: 100vw;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.heart{
    font-size: clamp(60px, 15vw, 90px);
    animation: pulse 1.2s infinite;
}

.message{
    margin-top: 25px;
    font-size: clamp(18px, 5vw, 28px);
    letter-spacing: 2px;
    opacity: .9;
    text-align: center;
}

.count{
    margin-top: 35px;
    font-size: clamp(50px, 15vw, 70px);
    color: #ff4d88;
    font-weight: bold;
}

@keyframes pulse{
    0%{
        transform: scale(1);
    }
    50%{
        transform: scale(1.3);
    }
    100%{
        transform: scale(1);
    }
}

.fade{
    animation: fade 1.2s forwards;
}

@keyframes fade{
    to{
        opacity: 0;
    }
}

</style>

</head>

<body>

<div class="heart">❤️</div>

<div class="message">
Preparing your surprise...
</div>

<div class="count" id="count">
3
</div>

<script>

let number = 3;

const count = document.getElementById("count");

const timer = setInterval(()=>{

    number--;

    if(number > 0){

        count.innerHTML = number;

    }

    else{

        clearInterval(timer);

        document.body.classList.add("fade");

        setTimeout(()=>{

            window.location.href = "/surprise";

        }, 1200);

    }

}, 1000);

</script>

</body>
</html>
