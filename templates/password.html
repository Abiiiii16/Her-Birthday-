<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock My Heart ❤️</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/password.css') }}">
</head>

<body>

<div class="container">

    <!-- Lock -->
    <div id="lock" class="lock">🔒</div>

    <h1>Enter Our Secret PIN ❤️</h1>

    <p>Only you know the magic code...</p>

    <!-- Hidden Flask Form -->
    <form id="pinForm" action="/check" method="POST">
        <input
            type="hidden"
            id="password"
            name="password">
    </form>

    <!-- PIN Dots -->
    <div id="dots" class="dots">
        ○ ○ ○ ○
    </div>

    <!-- Wrong Password -->
    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <!-- Keypad -->
    <div class="keypad">

        <button type="button" onclick="press(1)">1</button>
        <button type="button" onclick="press(2)">2</button>
        <button type="button" onclick="press(3)">3</button>

        <button type="button" onclick="press(4)">4</button>
        <button type="button" onclick="press(5)">5</button>
        <button type="button" onclick="press(6)">6</button>

        <button type="button" onclick="press(7)">7</button>
        <button type="button" onclick="press(8)">8</button>
        <button type="button" onclick="press(9)">9</button>

        <!-- Bottom Row -->
        <button
            type="button"
            class="heart-btn"
            onclick="clearPin()">
            ❤️
        </button>

        <button
            type="button"
            onclick="press(0)">
            0
        </button>

        <button
            type="button"
            class="send-btn"
            onclick="submitPin()">
            💌
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='js/password.js') }}"></script>

</body>

</html>
